<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    The favicon: the pink dot from the wordmark (LogoMark in components/Logo.tsx)
    on the site's black, so it reads on both light and dark browser tabs.

    Colours are literal rather than currentColor: a favicon renders outside the
    page, so it inherits nothing.
  -->
  <rect width="256" height="256" rx="56" fill="#000000"/>
  <circle cx="128" cy="128" r="60" fill="#ff488b"/>
</svg>
